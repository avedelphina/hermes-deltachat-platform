name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]  # Hermes 0.21.5 runs on 3.12, 0.21.6 on 3.14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Hermes itself is mocked in tests/conftest.py. aiortc (which brings av)
      # is needed by the call tests, httpx by the image-URL tests.
      - run: pip install pytest pytest-asyncio aiortc httpx
      # The slow WebRTC loopback tests are excluded by tests/pytest.ini.
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same black as the dev setup: a newer one can reformat unchanged code.
      - run: pip install black==26.5.1 flake8
      - run: make check
      - run: make lint
